<script>
(() => {
  'use strict';
  const status = document.getElementById('gate-status');
  const retry = document.getElementById('retry');
  let busy = false, attempt = 0;
  function decode(value) {
    if (!/^[A-Za-z0-9_-]+$/.test(value)) throw new Error('invalid-format');
    const base64 = value.replace(/-/g, '+').replace(/_/g, '/');
    return Uint8Array.from(atob(base64 + '='.repeat((4 - base64.length % 4) % 4)), c => c.charCodeAt(0));
  }
  async function unlock() {
    if (busy) return;
    const ticket = ++attempt;
    const params = new URLSearchParams(location.hash.slice(1));
    let rawKey = params.get('k') || '';
    const currentHash = location.hash;
    retry.hidden = true;
    if (!rawKey) {
      status.textContent = '这个链接缺少邀请密钥。请向邀请人索取完整链接，并保留 # 后面的全部内容。';
      return;
    }
    if (!isSecureContext || !globalThis.crypto?.subtle) {
      status.textContent = '需要 HTTPS 安全连接和支持加密功能的浏览器。请复制完整邀请链接，用系统浏览器打开。';
      return;
    }
    if (params.getAll('k').length !== 1 || !/^[A-Za-z0-9_-]{43}$/.test(rawKey)) {
      status.textContent = '邀请链接似乎不完整。请重新复制完整链接，不要手动缩短或修改。';
      return;
    }
    busy = true;
    retry.disabled = true;
    status.textContent = '正在你的设备上打开邀请，不会发送密钥…';
    try {
      const sealed = JSON.parse(document.getElementById('sealed-game').textContent);
      if (sealed.v !== 1 || sealed.alg !== 'A256GCM') throw new Error('unsupported-format');
      const bytes = decode(rawKey);
      if (bytes.length !== 32) throw new Error('invalid-key');
      const key = await crypto.subtle.importKey('raw', bytes, {name:'AES-GCM'}, false, ['decrypt']);
      bytes.fill(0);
      rawKey = '';
      const iv = decode(sealed.iv);
      if (iv.length !== 12) throw new Error('invalid-iv');
      const plain = await crypto.subtle.decrypt({name:'AES-GCM',iv,additionalData:new TextEncoder().encode('wgr-bingo-invite-v2'),tagLength:128}, key, decode(sealed.ciphertext));
      if (ticket !== attempt || location.hash !== currentHash) return;
      const html = new TextDecoder('utf-8', {fatal:true}).decode(plain);
      if (!html.startsWith('<!DOCTYPE html>')) throw new Error('invalid-document');
      // Never document.write while the initial HTML parser is still active:
      // it can append the game instead of replacing the locked document.
      if (document.readyState === 'loading') {
        await new Promise(resolve => document.addEventListener('DOMContentLoaded', resolve, {once:true}));
      }
      await new Promise(resolve => setTimeout(resolve, 0));
      if (ticket !== attempt || location.hash !== currentHash) return;
      // This complete document is authenticated by AES-GCM before execution.
      // Keep the fragment for ordinary reload; never store it in localStorage.
      document.open();
      document.write(html);
      document.close();
    } catch {
      if (ticket === attempt) {
        status.textContent = '暂时无法解锁：链接可能不正确、已更换，或页面尚未更新。请向邀请人确认完整链接后重试。';
        retry.hidden = false;
      }
    } finally {
      rawKey = '';
      busy = false;
      retry.disabled = false;
      if (location.hash !== currentHash) unlock();
    }
  }
  retry.onclick = unlock;
  window.addEventListener('hashchange', () => { attempt++; unlock(); });
  unlock();
})();
</script>
